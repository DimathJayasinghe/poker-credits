name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  rust:
    name: Rust (fmt, clippy, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Reads rust-toolchain.toml, so CI and local use the same pinned toolchain.
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - name: No room data in logs (virtual cards stay secret)
        run: bash tool/check_no_state_logging.sh
      - run: cargo test --workspace

  dart:
    name: Dart / Flutter (format, analyze, test, web build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read the pinned Flutter version from .fvmrc
        id: fvm
        run: echo "version=$(jq -r .flutter .fvmrc)" >> "$GITHUB_OUTPUT"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.fvm.outputs.version }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed app packages
      # Per package: the repository root also holds vendored build tooling (cargokit) whose own
      # dependencies are not part of the workspace, and it is not ours to lint.
      - run: flutter analyze
        working-directory: app
      - run: flutter analyze
        working-directory: packages/poker_protocol
      - run: flutter analyze
        working-directory: packages/poker_bridge
      # Each package runs from its own directory: the app tests load fonts and goldens by relative
      # path, and the protocol tests look for the shared fixtures.
      - name: App tests
        run: flutter test
        working-directory: app
      - name: Protocol tests
        run: flutter test
        working-directory: packages/poker_protocol
      - name: Bridge tests
        run: flutter test
        working-directory: packages/poker_bridge
      - name: Web-safety guard (ADR-014, ADR-013)
        run: bash tool/check_web_safe.sh
      - name: Web build smoke test (ADR-014)
        run: flutter build web --no-web-resources-cdn
        working-directory: app

  deny:
    name: Dependencies (cargo deny)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Advisories, licences, bans and sources, as set in deny.toml.
      - uses: EmbarkStudios/cargo-deny-action@v2
