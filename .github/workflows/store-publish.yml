name: Microsoft Store publish

# Sends the Store package (MSIX) of a stable version tag to Partner Center. docs/MICROSOFT_STORE.md section 9
# has the one-time setup; ADR-022 has the reasoning.
#
# Not every push to main: every submission is reviewed by Microsoft, the Store allows one submission in flight and
# its version must rise, so a version tag (vX.Y.Z, on a commit that is on main) is the "stable" signal. The tag push
# already runs "Desktop builds", which builds the package; this workflow waits for that run to succeed and takes the
# package from it, so what is submitted is exactly what CI built.
#
# It does nothing (and stays green) until the credentials exist, and it only works for an app that is already live in
# the Store: the first submission is made by hand in Partner Center. workflow_run only fires from the default branch.
on:
  workflow_run:
    workflows: ['Desktop builds']
    types: [completed]
  workflow_dispatch:
    inputs:
      run_id:
        description: 'Id of a successful "Desktop builds" run on a version tag (the number in its URL)'
        required: true

concurrency:
  group: microsoft-store
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  publish:
    name: Submit to Microsoft Store
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      startsWith(github.event.workflow_run.head_branch, 'v') &&
      github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: windows-latest
    # Create this environment in Settings > Environments and add yourself as a required reviewer to make every
    # submission wait for one click. Without a reviewer it runs at once.
    environment: microsoft-store
    env:
      RUN_ID: ${{ github.event.workflow_run.id || inputs.run_id }}
      REPO: ${{ github.repository }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Check that the setup is complete
        id: setup
        shell: pwsh
        env:
          TENANT: ${{ secrets.AZURE_AD_TENANT_ID }}
          CLIENT: ${{ secrets.AZURE_AD_APPLICATION_CLIENT_ID }}
          SECRET: ${{ secrets.AZURE_AD_APPLICATION_SECRET }}
          SELLER: ${{ secrets.SELLER_ID }}
          PRODUCT: ${{ vars.MSSTORE_PRODUCT_ID || secrets.MSSTORE_PRODUCT_ID }}
        run: |
          $missing = @()
          if (-not $env:TENANT) { $missing += 'AZURE_AD_TENANT_ID' }
          if (-not $env:CLIENT) { $missing += 'AZURE_AD_APPLICATION_CLIENT_ID' }
          if (-not $env:SECRET) { $missing += 'AZURE_AD_APPLICATION_SECRET' }
          if (-not $env:SELLER) { $missing += 'SELLER_ID' }
          if (-not $env:PRODUCT) { $missing += 'MSSTORE_PRODUCT_ID' }
          if ($missing.Count -gt 0) {
            Write-Output "::notice title=Store publishing is not set up::Missing: $($missing -join ', '). Nothing was submitted. See docs/MICROSOFT_STORE.md section 9."
            'ready=false' >> $env:GITHUB_OUTPUT
          } else {
            'ready=true' >> $env:GITHUB_OUTPUT
          }

      - name: Check the build run is a stable tag on main
        id: source
        if: steps.setup.outputs.ready == 'true'
        shell: pwsh
        run: |
          $json = gh run view $env:RUN_ID --repo $env:REPO --json workflowName,conclusion,event,headBranch,headSha
          if ($LASTEXITCODE -ne 0) { throw "cannot read run $env:RUN_ID" }
          $run = $json | ConvertFrom-Json
          if ($run.workflowName -ne 'Desktop builds') { throw "run $env:RUN_ID is '$($run.workflowName)', not 'Desktop builds'" }
          if ($run.conclusion -ne 'success') { throw "run $env:RUN_ID did not succeed ($($run.conclusion))" }
          if ($run.event -ne 'push') { throw "run $env:RUN_ID was started by '$($run.event)', not by a tag push" }
          if ($run.headBranch -notmatch '^v\d+\.\d+\.\d+$') { throw "'$($run.headBranch)' is not a stable version tag (vX.Y.Z)" }
          # The tagged commit has to be on main: "identical" or "behind" means main contains it.
          $relation = gh api "repos/$env:REPO/compare/main...$($run.headSha)" --jq .status
          if ($LASTEXITCODE -ne 0) { throw 'cannot compare the tagged commit with main' }
          if ($relation -notin @('identical', 'behind')) { throw "commit $($run.headSha) is not on main ($relation)" }
          "tag=$($run.headBranch)" >> $env:GITHUB_OUTPUT

      - name: Download the package that CI built
        if: steps.setup.outputs.ready == 'true'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: poker-credits-msix
          path: store-package
          run-id: ${{ env.RUN_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Check the package
        id: package
        if: steps.setup.outputs.ready == 'true'
        shell: pwsh
        env:
          TAG: ${{ steps.source.outputs.tag }}
        run: |
          $files = @(Get-ChildItem store-package -Filter *.msix)
          if ($files.Count -ne 1) { throw "expected exactly one .msix, found $($files.Count)" }
          $msix = $files[0]
          if ($msix.Name -match 'PLACEHOLDER') {
            throw 'this is the placeholder package: set MSSTORE_IDENTITY_NAME, MSSTORE_PUBLISHER and MSSTORE_PUBLISHER_DISPLAY_NAME, then build again'
          }
          # The version inside the package must be the tag's (v1.4.0 becomes 1.4.0.0), so a stale build is never sent.
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zip = [System.IO.Compression.ZipFile]::OpenRead($msix.FullName)
          try {
            $reader = New-Object System.IO.StreamReader($zip.GetEntry('AppxManifest.xml').Open())
            $manifest = [xml]$reader.ReadToEnd()
          } finally { $zip.Dispose() }
          $version = $manifest.SelectSingleNode("//*[local-name()='Identity']").GetAttribute('Version')
          $expected = $env:TAG.TrimStart('v') + '.0'
          if ($version -ne $expected) { throw "package version $version does not match tag $($env:TAG) (expected $expected)" }
          "msix=$($msix.FullName)" >> $env:GITHUB_OUTPUT
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Install the Microsoft Store Developer CLI
        if: steps.setup.outputs.ready == 'true'
        uses: microsoft/microsoft-store-apppublisher@15abd1c50fcc164b19cb240fb04ef3c49bf715a2 # v1.1

      - name: Submit to Partner Center
        if: steps.setup.outputs.ready == 'true'
        shell: pwsh
        env:
          TENANT: ${{ secrets.AZURE_AD_TENANT_ID }}
          CLIENT: ${{ secrets.AZURE_AD_APPLICATION_CLIENT_ID }}
          SECRET: ${{ secrets.AZURE_AD_APPLICATION_SECRET }}
          SELLER: ${{ secrets.SELLER_ID }}
          PRODUCT: ${{ vars.MSSTORE_PRODUCT_ID || secrets.MSSTORE_PRODUCT_ID }}
          MSIX: ${{ steps.package.outputs.msix }}
          VERSION: ${{ steps.package.outputs.version }}
          # Until the repository variable MSSTORE_AUTO_COMMIT is 'true' the submission is only prepared as a draft
          # in Partner Center and the owner presses Submit there.
          COMMIT: ${{ vars.MSSTORE_AUTO_COMMIT }}
        run: |
          msstore reconfigure --tenantId $env:TENANT --sellerId $env:SELLER --clientId $env:CLIENT --clientSecret $env:SECRET
          if ($LASTEXITCODE -ne 0) { throw 'msstore reconfigure failed' }
          $extra = @()
          if ($env:COMMIT -ne 'true') { $extra += '--noCommit' }
          msstore publish $env:MSIX -id $env:PRODUCT @extra
          if ($LASTEXITCODE -ne 0) { throw 'msstore publish failed' }
          $how = if ($env:COMMIT -eq 'true') { 'submitted for certification' } else { 'left as a draft: open Partner Center and press Submit' }
          "Poker Credits $($env:VERSION): $how." >> $env:GITHUB_STEP_SUMMARY
