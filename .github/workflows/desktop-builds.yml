name: Desktop builds

# Builds the Windows and Linux apps and keeps them as downloadable artifacts. Runs by hand
# (Actions tab, once this file is on the default branch), on version tags, and on a pull request
# that changes this file, so the first run can happen before anything is merged.
on:
  workflow_dispatch:
  push:
    tags: ['v*']
  pull_request:
    paths: ['.github/workflows/desktop-builds.yml']

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows (x64)
            os: windows-latest
            target: windows
            output: app/build/windows/x64/runner/Release
          - name: Linux (x64)
            os: ubuntu-latest
            target: linux
            output: app/build/linux/x64/release/bundle
    steps:
      - uses: actions/checkout@v4
      - name: Linux build packages
        if: matrix.target == 'linux'
        run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libsecret-1-dev lld
      # The Flutter-Rust bridge compiles the engine and server with the pinned toolchain.
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: Read the pinned Flutter version from .fvmrc
        id: fvm
        shell: bash
        run: echo "version=$(jq -r .flutter .fvmrc)" >> "$GITHUB_OUTPUT"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.fvm.outputs.version }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Build
        run: flutter build ${{ matrix.target }} --release
        working-directory: app
      - name: Pack (Windows)
        if: matrix.target == 'windows'
        shell: pwsh
        run: Compress-Archive -Path "${{ matrix.output }}/*" -DestinationPath poker-credits-windows-x64.zip
      - name: Pack (Linux)
        if: matrix.target == 'linux'
        run: tar -czf poker-credits-linux-x64.tar.gz -C "$(dirname '${{ matrix.output }}')" bundle
      - uses: actions/upload-artifact@v4
        with:
          name: poker-credits-${{ matrix.target }}
          path: |
            poker-credits-windows-x64.zip
            poker-credits-linux-x64.tar.gz
          if-no-files-found: error
          retention-days: 14
