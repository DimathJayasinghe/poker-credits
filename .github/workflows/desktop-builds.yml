name: Desktop builds

# Builds the Windows (zip, installer and Microsoft Store package) and Linux apps and keeps them as downloadable artifacts. Runs by hand
# (Actions tab, once this file is on the default branch), on version tags, and on a pull request
# that changes this file, so the first run can happen before anything is merged.
on:
  workflow_dispatch:
  push:
    tags: ['v*']
  pull_request:
    paths: ['.github/workflows/desktop-builds.yml', 'packaging/windows/**', 'tool/msix_stage.py']

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows (x64)
            os: windows-latest
            target: windows
            output: app/build/windows/x64/runner/Release
          - name: Linux (x64)
            os: ubuntu-latest
            target: linux
            output: app/build/linux/x64/release/bundle
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Linux build packages
        if: matrix.target == 'linux'
        run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libsecret-1-dev libasound2-dev lld
      # The Flutter-Rust bridge compiles the engine and server with the pinned toolchain.
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
      - name: Read the pinned Flutter version from .fvmrc
        id: fvm
        shell: bash
        run: echo "version=$(jq -r .flutter .fvmrc)" >> "$GITHUB_OUTPUT"
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ steps.fvm.outputs.version }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Build
        run: flutter build ${{ matrix.target }} --release -v
        working-directory: app
      # The Flutter Windows bundle does not carry the Visual C++ runtime. Shipping these three DLLs next
      # to the exe (app-local deployment) lets it start on a PC that never installed it.
      - name: Add the Visual C++ runtime (Windows)
        if: matrix.target == 'windows'
        shell: pwsh
        run: |
          foreach ($dll in 'msvcp140.dll', 'vcruntime140.dll', 'vcruntime140_1.dll') {
            Copy-Item "$env:SystemRoot\System32\$dll" "${{ matrix.output }}"
          }
      - name: Pack (Windows)
        if: matrix.target == 'windows'
        shell: pwsh
        run: Compress-Archive -Path "${{ matrix.output }}/*" -DestinationPath poker-credits-windows-x64.zip
      - name: Installer (Windows)
        if: matrix.target == 'windows'
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          $version = ((Select-String -Path app/pubspec.yaml -Pattern '^version:\s*([0-9.]+)').Matches[0].Groups[1].Value)
          $source = Join-Path $PWD "${{ matrix.output }}"
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=$version" "/DSourceDir=$source" "/DOutputDir=$PWD" packaging/windows/installer.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed" }
      - name: Pack (Linux)
        if: matrix.target == 'linux'
        run: |
          cp packaging/linux/install.sh packaging/linux/dev.pokercredits.poker_credits.desktop '${{ matrix.output }}/'
          chmod +x '${{ matrix.output }}/install.sh'
          tar -czf poker-credits-linux-x64.tar.gz -C "$(dirname '${{ matrix.output }}')" bundle
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: poker-credits-${{ matrix.target }}
          path: |
            poker-credits-windows-x64.zip
            poker-credits-windows-x64-setup.exe
            poker-credits-linux-x64.tar.gz
          if-no-files-found: error
          retention-days: 14
      # The Microsoft Store package. It comes after the upload above on purpose: a problem in the
      # manifest turns this job red but never costs the zip, the installer or the Linux build.
      # The three identity values are repository variables (Settings > Secrets and variables > Actions >
      # Variables; a secret of the same name works too, but its value is then hidden in the logs) copied from Partner Center, "Product identity"; without them the package gets
      # placeholder values, is named so, and only proves that packing works. docs/MICROSOFT_STORE.md.
      - name: Microsoft Store package (Windows)
        if: matrix.target == 'windows'
        shell: pwsh
        env:
          MSSTORE_IDENTITY_NAME: ${{ vars.MSSTORE_IDENTITY_NAME || secrets.MSSTORE_IDENTITY_NAME }}
          MSSTORE_PUBLISHER: ${{ vars.MSSTORE_PUBLISHER || secrets.MSSTORE_PUBLISHER }}
          MSSTORE_PUBLISHER_DISPLAY_NAME: ${{ vars.MSSTORE_PUBLISHER_DISPLAY_NAME || secrets.MSSTORE_PUBLISHER_DISPLAY_NAME }}
        run: |
          python tool/msix_stage.py --check
          if ($LASTEXITCODE -ne 0) { throw "the MSIX manifest check failed" }
          $stage = Join-Path $PWD 'msix-stage'
          $json = python tool/msix_stage.py --bundle "${{ matrix.output }}" --out $stage
          if ($LASTEXITCODE -ne 0) { throw "could not stage the MSIX folder" }
          $info = $json | ConvertFrom-Json
          $name = if ($info.placeholder) { 'poker-credits-windows-x64-PLACEHOLDER-do-not-submit.msix' } else { 'poker-credits-windows-x64.msix' }
          $makeappx = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\makeappx.exe" |
            Sort-Object { [version]$_.Directory.Parent.Name } | Select-Object -Last 1
          & $makeappx.FullName pack /d $stage /p $name /o
          if ($LASTEXITCODE -ne 0) { throw "makeappx failed" }
          if ($info.placeholder) { Write-Warning "No Partner Center identity is set, so this package is a placeholder and must not be uploaded to the Store." }
          Get-Item $name | Format-List Name, Length
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: matrix.target == 'windows'
        with:
          name: poker-credits-msix
          path: poker-credits-windows-x64*.msix
          if-no-files-found: error
          retention-days: 14
