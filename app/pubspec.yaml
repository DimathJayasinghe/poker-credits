name: poker_credits
description: "Chips and pots for physical-card Texas Hold'em."
publish_to: none
resolution: workspace
version: 0.1.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  logging: ^1.3.0
  package_info_plus: ^10.2.2
  poker_protocol:
    path: ../packages/poker_protocol

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  # Fonts are bundled (SIL OFL, licences next to the files). Never download fonts at runtime:
  # LAN games are offline (ADR-013).
  fonts:
    - family: ArchivoBlack
      fonts:
        - asset: assets/fonts/ArchivoBlack-Regular.ttf
    - family: SpaceMono
      fonts:
        - asset: assets/fonts/SpaceMono-Regular.ttf
        - asset: assets/fonts/SpaceMono-Bold.ttf
          weight: 700
