name: poker_credits
description: "Chips and pots for physical-card Texas Hold'em."
publish_to: none
resolution: workspace
version: 1.5.0+10

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  flutter_secure_storage: ^11.2.0
  flutter_soloud: ^4.1.7
  logging: ^1.3.0
  mobile_scanner: ^7.5.0
  package_info_plus: ^10.2.2
  path_provider: ^2.1.6
  poker_bridge:
    path: ../packages/poker_bridge
  poker_protocol:
    path: ../packages/poker_protocol
  pretty_qr_code: ^3.6.0
  refena_flutter: ^3.7.0
  url_launcher: ^6.3.3
  wakelock_plus: ^1.7.0
  web_socket_channel: ^3.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  fake_async: ^1.3.3

flutter:
  uses-material-design: true

  assets:
    - assets/images/grain.png
    - assets/sounds/

  # Fonts are bundled (SIL OFL, licences next to the files). Never download fonts at runtime:
  # LAN games are offline (ADR-013).
  fonts:
    - family: Anton
      fonts:
        - asset: assets/fonts/Anton-Regular.ttf
    - family: SpaceMono
      fonts:
        - asset: assets/fonts/SpaceMono-Regular.ttf
        - asset: assets/fonts/SpaceMono-Bold.ttf
          weight: 700
