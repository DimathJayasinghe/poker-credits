[package]
name = "poker_server_core"
description = "Authoritative poker room server: rooms as actors, WebSocket protocol, snapshots and journal."
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
axum = { version = "0.8.9", features = ["ws"] }
getrandom = "0.4.3"
poker_engine = { version = "1.0.0", path = "../poker_engine" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
subtle = "2.6.1"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "fs"] }
tracing = "0.1.44"

[features]
# Adds message types that crash a room on purpose. For tests only; never enable in a release.
test-hooks = []

[lints]
workspace = true

[dev-dependencies]
poker_server_core = { path = ".", features = ["test-hooks"] }
proptest = "1.12.0"
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["test-util"] }
